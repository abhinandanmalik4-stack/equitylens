[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "equitylens"
version = "0.1.0"
description = "Python-first stock research dashboard with explicit data provenance"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit>=1.66.1,<1.67",
    "plotly>=6,<7",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
docs = ["Pillow>=11,<14"]

[tool.setuptools.packages.find]
where = ["src"]
